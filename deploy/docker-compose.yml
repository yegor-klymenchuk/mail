services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mail
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mail -d mail']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mail
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:?Set S3_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 512m
    networks:
      - default
      - dokploy-network

  ntfy:
    image: binwiederhier/ntfy:v2.14.0
    restart: unless-stopped
    command: serve
    environment:
      TZ: UTC
    volumes:
      - ntfy_cache:/var/cache/ntfy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://localhost/v1/health | grep -q true']
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 96m

  mail:
    image: ${MAIL_IMAGE:?Set MAIL_IMAGE to a published commit image}
    restart: unless-stopped
    environment:
      SERVICE: all
      NODE_ENV: production
      DATABASE_URL: postgresql://mail:${DB_PASSWORD}@postgres:5432/mail?connection_limit=8
      DIRECT_DATABASE_URL: postgresql://mail:${DB_PASSWORD}@postgres:5432/mail
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      API_DOMAIN: ${API_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
      WIKI_DOMAIN: ${WIKI_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      USE_HTTPS: 'true'
      SMTP_DOMAIN: localhost
      SMTP_ENABLED: 'false'
      AWS_SES_REGION: eu-central-1
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:?Set AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:?Set AWS_SES_SECRET_ACCESS_KEY}
      SES_CONFIGURATION_SET: plunk-tracking
      SES_CONFIGURATION_SET_NO_TRACKING: plunk-no-tracking
      MAIL_FROM_SUBDOMAIN: plunk
      EMAIL_RATE_LIMIT_PER_SECOND: '1'
      EMAIL_WORKER_CONCURRENCY: '2'
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-true}
      AUTO_PROJECT_DISABLE: 'true'
      RATE_LIMIT_ENABLED: 'true'
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: mail
      S3_ACCESS_KEY_SECRET: ${S3_PASSWORD}
      S3_BUCKET: uploads
      S3_PUBLIC_URL: https://${ASSETS_DOMAIN}/uploads
      S3_FORCE_PATH_STYLE: 'true'
      NTFY_URL: http://ntfy/mail-notifications
    volumes:
      - mail_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/health && curl -fsS -o /dev/null http://localhost:3000/auth/login']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    mem_limit: 1536m
    networks:
      - default
      - dokploy-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mail_data:
  ntfy_cache:

networks:
  dokploy-network:
    external: true
